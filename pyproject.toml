[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-minco"
version = "0.1.0"
description = "Traceable Query-MINCO reference method"
requires-python = ">=3.8"
dependencies = ["torch>=2.4,<2.5", "numpy>=1.22,<1.23", "scipy>=1.10,<1.11"]

[tool.setuptools.packages.find]
include = ["query_minco*"]

[tool.setuptools.package-data]
query_minco = ["methods/*.json", "_vendor/minco/LICENSE"]
